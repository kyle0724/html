        <h4>山本賽後受訪時依舊語氣平靜，「我覺得自己今天投得很好，雖然有失分，但能保持冷靜最重要。」他強調這是一場「不能輸的比賽」，只想專注在每一球、每一個節奏上。
        道奇總教練羅伯斯（Dave Roberts）則盛讚：「他完全進入比賽的Zone裡，從第一球開始就讓我知道——輸球不是選項。」
        外媒形容，山本的表現不僅重現了「老派投手的浪漫」，更讓球迷重新思考現代棒球裡「專注、責任與謙遜」的價值。</h4>

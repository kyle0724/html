<body>
  <html>
     <body>
      <!--2*3表格-->
    <table border ="2">
        <tr><td>1</td><td>2</td><td>3</td></tr>
        <tr><td>4</td><td>5</td><td>6</td></tr>
        <!-- colspan-->
        <table border ="1">
             <tr><td>1</td><td colspan ="2">2 3</td></tr>
             <tr><td>4</td><td>5</td><td>6</td></tr>
        <!-- rowspan-->
        <table border ="1">
            <tr><td rowspan = "2"> 1 4</td><td>2</td><td>3</td></tr>
                                           <td>5</td><td>6</td></tr>
        <!--rowspan-->
        <table border ="1">
             <tr><td>1</td><td colspan =2 rowspan ="2"> 2 3 5 6</td>
              <tr><td>4</td></tr>
              <tr><td>7</td><td>8</td><td>9</td></tr>

    </table>
    </body>
</html>

</body>

        <p id="p1">這名高中生當天在暴雨中被水花濺濕後，憤恨難平，創作〈濺水記〉、〈水漬〉、〈致暴雨中的白車〉等多篇作品。其中〈濺水記〉以古文體開頭：「今晨暴雨急，吾撐傘上學堂。忽有白車如電過，輪壓積水起狂浪。」</p>
        <p id="p2">最終，高中生在道歉文中寫下：「那日濕透的衣衫，晾乾便好；但人與人之間的尊重若被浸濕，需要更多誠意才能撫平。」</p>
